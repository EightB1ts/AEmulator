# EXAMPLE reference profile — Xiaomi 13 (`fuxi`) / Qualcomm Snapdragon 8 Gen 2 (`SM8550`).
#
# LEGAL NOTE: this is clearly-labeled EXAMPLE reference data. Fabricating and *shipping* a
# specific-OEM identity requires counsel (trademark / TAC-reprogramming statutes). Use as a
# dev/test fixture only.
#
# PROVENANCE, honestly stated — not every field here carries the same weight:
#   * VERIFIED against public platform data: the whole `[soc]` block (SM8550 = `kalama`, socinfo id
#     519, the 1+2+2+3 Cortex-X3/A715/A710/A510 topology, its MIDR part numbers and cpufreq maxima)
#     and the Adreno 740 vendor identity. These are the load-bearing values for SoC coherence.
#   * DELIBERATELY BELOW the part they name: `gpu.gl_version` (GLES 3.1, not the A740's real 3.2) and
#     `gpu.ro_hardware_egl` (`angle`, not `adreno`). See the `[gpu]` provenance note — both are cases
#     where the accurate-looking value breaks rendering outright.
#   * SHAPE-ACCURATE derivations: the `[build]` strings are a coherent Xiaomi 13 / MIUI 14 (Android
#     13) release-build fingerprint, not a byte-for-byte dump.
#   * CARRIED OVER from the previous Redmi K40 fixture: `[[sensors]]` and `[network]`. Sensor parts
#     are not SoC-tied and the Xiaomi OUI is unchanged; they were not re-verified for `fuxi`.
#
# This file is the on-disk twin of `profiles::reference_profile()`; `DeviceProfile::from_toml`
# loads it, and the two must materialize identical `emit_properties()` maps (guarded by a test).

[meta]
name = "Xiaomi 13 (fuxi) / SM8550"
source = "Snapdragon 8 Gen 2 (SM8550/kalama) public platform data + a Xiaomi 13 `fuxi` MIUI 14 build shape"
legal_note = "EXAMPLE reference data. Fabricating a specific-OEM identity requires counsel (trademark / TAC-reprogramming statutes). Reference/dev fixture only."

[build]
brand = "Xiaomi"
product_name = "fuxi"
device = "fuxi"
model = "2211133C"
manufacturer = "Xiaomi"
board = "fuxi"
bootloader = "unknown"
hardware = "qcom"
host = "c5-miui-ota-bd131.bj"
user = "builder"
tags = "release-keys"
build_type = "user"
build_id = "TKQ1.220829.002"
incremental = "V14.0.6.0.TMCCNXM"
release = "13"
sdk = 33
security_patch = "2023-04-01"
display_id = "TKQ1.220829.002"

[soc]
soc_manufacturer = "QTI"
soc_model = "SM8550"
board_platform = "kalama"

# Snapdragon 8 Gen 2 is a 1+2+2+3 part: 1x Cortex-X3 "prime" + 2x Cortex-A715 + 2x Cortex-A710
# ("gold", two different µarchs in the same performance tier — that split is real and a uniform
# gold cluster would be the anomaly) + 3x Cortex-A510 "silver". Every core is a stock ARM design,
# so the implementer is ARM (0x41) — Qualcomm stopped shipping custom-Kryo `0x51` MIDRs years
# before this part, and NEVER Apple (0x61).
[[soc.midr_clusters]]
part_name = "Cortex-X3 (prime)"
implementer = 65   # 0x41 ARM Ltd.
part = 3406        # 0xd4e Cortex-X3
variant = 1
revision = 0
core_count = 1
max_freq_khz = 3187200

[[soc.midr_clusters]]
part_name = "Cortex-A715 (gold)"
implementer = 65   # 0x41
part = 3405        # 0xd4d Cortex-A715
variant = 1
revision = 0
core_count = 2
max_freq_khz = 2803200

[[soc.midr_clusters]]
part_name = "Cortex-A710 (gold)"
implementer = 65   # 0x41
part = 3399        # 0xd47 Cortex-A710
variant = 1
revision = 0
core_count = 2
max_freq_khz = 2803200

[[soc.midr_clusters]]
part_name = "Cortex-A510 (silver)"
implementer = 65   # 0x41
part = 3398        # 0xd46 Cortex-A510
variant = 1
revision = 0
core_count = 3
max_freq_khz = 2016000

[soc.socinfo]
family = "Snapdragon"
machine = "fuxi"
soc_id = 519       # SM8550 (kalama) in drivers/soc/qcom/socinfo.c
revision = "2.0"
serial_number = ""
foundry_id = 0
chip_family = 0
raw_device_family = 0
raw_device_number = 0
hardware_platform = "MTP"
pmic_model = ""

[abi]
abilist = "arm64-v8a,armeabi-v7a,armeabi"
abilist32 = "armeabi-v7a,armeabi"
abilist64 = "arm64-v8a"

# Adreno 740 — a Vulkan 1.3 device (the SM8250-era Adreno 650 topped out at 1.1 on its shipping
# driver). This is the level the guest must be able to claim for a Vulkan 1.3 host renderer
# (gfxstream -> KosmicKrisp, which advertises apiVersion 1.4.354) to be a coherent story.
#
# PROVENANCE — two ADMITTED, PERMANENT incoherences against a real Adreno 740. Both are cases where
# the honest-but-wrong value renders and the accurate-looking one does not; neither is a gap to close
# in a later pass:
#
#   1. `gl_version` says GLES **3.1**. A real Adreno 740 IS a GLES 3.2 part — this claim is
#      deliberately below the hardware it names. GLES 3.2 requires geometry AND tessellation
#      shaders. The measured host (gfxstream/evidence/host-vulkan-identity.json) reports
#      `tessellationShader: true` but `geometryShader: false`: that is Apple hardware, not a porting
#      gap, and ANGLE cannot synthesize the stage. Raising `androidboot.opengles.version` to 196610
#      is the WRONG fix — an app that reads GL_VERSION 3.2 and then calls
#      `glCreateShader(GL_GEOMETRY_SHADER)` gets nothing, which is a worse tell than 3.1 *and* broken
#      rendering. `validate` pins this to `BOOT_OPENGLES_VERSION` (196609) so the two cannot drift.
#
#   2. `ro_hardware_egl` says **angle**, not `adreno`. This one was an active bug: Android's EGL
#      loader dlopen()s `libEGL_${ro.hardware.egl}.so` with no fallback, the guest image ships no
#      `libEGL_adreno.so`, and every launcher already puts `androidboot.hardware.egl=angle` on the
#      cmdline — so if this profile's value had ever won, GL would have disappeared entirely
#      (SurfaceFlinger/zygote abort, late and silent from the host side). `angle` is NOT a tell:
#      Pixel ships ANGLE as its default GLES driver, and it is verified to initialize in this image.
#
# `vk_device_id` and `vk_subgroup_size` are 0 = "leave the host's value alone". No verified A740
# Vulkan deviceID exists in this repo and a fabricated one is a fresh inconsistency; subgroupSize is
# a capability claim in disguise (a shader reading gl_SubgroupSize gets the wrong answer if it
# disagrees with the hardware).
[gpu]
gl_vendor = "Qualcomm"
gl_renderer = "Adreno (TM) 740"
gl_version = "OpenGL ES 3.1 V@0744.0 (GIT@a0d5f2b, Ie4a2f9d70e, 1675814076)"
vk_device_name = "Adreno (TM) 740"
vk_vendor_id = 20803   # 0x5143 Qualcomm
vk_device_id = 0       # sentinel: keep the host's
vk_device_type = "integrated_gpu"
vk_driver_id = "VK_DRIVER_ID_QUALCOMM_PROPRIETARY"
vk_subgroup_size = 0   # sentinel: keep the host's
ro_hardware_egl = "angle"

# The panel. VERIFIED against public fuxi specs: 6.36" (162 mm) 1080x2400 AMOLED, density bucket
# 440 (1080 px / (440/160) = 393 dp of width — what a real Xiaomi 13 reports) against a ~414 ppi
# physical density. The physical millimetre size is NOT stored: it is derived from `diagonal_mm` plus
# the pixel aspect (162 mm diagonal -> 66x147 mm), so it can never drift out of agreement with the
# resolution, and it is what the emitted EDID carries as the DRM connector's width_mm/height_mm.
#
# `refresh_hz` is 60, not the panel's 120: the host presents at 60 and the EDID's detailed timing
# must agree with what is actually scanned out. `density_dpi` reaches the guest as
# `androidboot.lcd_density` -> `ro.boot.lcd_density` -> `ro.sf.lcd_density`; NEVER as
# `qemu.sf.lcd_density`, which SurfaceFlinger prefers and which is on our own detection blocklist.
[display]
width_px = 1080
height_px = 2400
density_dpi = 440
refresh_hz = 60
diagonal_mm = 162

[[sensors]]
sensor_type = "accelerometer"
name = "LSM6DSO Accelerometer"
vendor = "STMicroelectronics"
max_range = 78.4532
resolution = 0.00239685
power = 0.15
min_delay = 2000

[[sensors]]
sensor_type = "magnetic_field"
name = "AK09918 Magnetometer"
vendor = "AKM"
max_range = 4912.0
resolution = 0.15
power = 1.1
min_delay = 10000

# WiFi-only tablet posture — the default. Deletes the whole IMEI/IMSI/SIM surface;
# `ro.baseband=unknown` is normal on a retail WiFi device.
[telephony]
mode = "wifi_only"

[verified_boot]
verifiedbootstate = "green"
flash_locked = true
device_state = "locked"
veritymode = "enforcing"

[network]
mac_oui = "F0:B4:29"   # Xiaomi OUI
interfaces = ["wlan0", "p2p0"]
