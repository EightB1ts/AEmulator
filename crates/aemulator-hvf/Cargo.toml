# aemulator-hvf — HVF (Apple Hypervisor.framework) backend skeleton + empirical MIDR-spoof probe.
#
# DELIBERATELY NOT a workspace member. It is listed in the root Cargo.toml `[workspace].exclude`
# so the default `cargo build` at the workspace root never touches it and cannot be broken by it
# (it links `-framework Hypervisor`, which only exists on macOS). Build it explicitly:
#
#   cargo build --manifest-path crates/aemulator-hvf/Cargo.toml
#
# See src/bin/hvf-midr-probe.rs for the make-or-break MIDR_EL1 spoof test.
[package]
name = "aemulator-hvf"
version = "0.0.1"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.96"
description = "Apple Hypervisor.framework (HVF) backend skeleton for AEmulator + MIDR_EL1 spoof probe (macOS/aarch64 only)."
publish = false

[lib]
name = "aemulator_hvf"
path = "src/lib.rs"

[[bin]]
name = "hvf-midr-probe"
path = "src/bin/hvf-midr-probe.rs"

[[bin]]
name = "aemulator-hvf"
path = "src/bin/aemulator-hvf.rs"

# Phase 3b proof: the CAMetalLayer presenter self-test.
[[bin]]
name = "aemu-display-selftest"
path = "src/bin/aemu-display-selftest.rs"

# Phase 1.1: generates host/vulkan/VkDecoderCerealGap.inc (the derived guest-visible extension strip
# list) and drift-checks the committed copy against the pinned gfxstream tree's codegen. Run by
# ci/hvf-doctor.sh in `verify` mode.
[[bin]]
name = "aemu-cereal-gap"
path = "src/bin/aemu-cereal-gap.rs"

[dependencies]
# Phase 5 (stealth / de-brand): reuse the workspace identity + DTB crates so the Android boot path
# emits the real-SoC DeviceProfile (Xiaomi/fuxi/SM8550) root compatible/model + a coherent
# serialno / verified-boot state, instead of the `linux,dummy-virt` / synthetic-serial tells.
# Path deps into workspace members (this crate is workspace-excluded); both are pure-Rust and
# macOS-buildable, so the default build stays hermetic.
aemulator-identity = { path = "../aemulator-identity" }
aemulator-dtb = { path = "../aemulator-dtb" }
# The lib stays dependency-free raw FFI. These deps power the run-linux VMM binary (memory,
# arm64 Image loader, FDT builder). Kept minimal + macOS/aarch64-buildable (no Linux-only crates).
libc = "0.2"
vm-memory = { version = "0.18", features = ["backend-mmap"] }
linux-loader = "0.14"
vm-fdt = "0.3"
virtio-queue = "0.18"
# --display window layer: a CPU-blit window (winit event loop + softbuffer surface). Cross-platform,
# no Metal needed for 2D scanout. macOS requires the winit event loop on the main thread.
winit = "0.29"
softbuffer = "0.4"
# Names the NSView handle winit already carries (rwh 0.6, the same version winit/softbuffer pull
# transitively). Used by display/metal.rs.
raw-window-handle = "0.6"

[build-dependencies]
# Compiles the Objective-C Metal presenter shim (src/display/metal_shim.m) + the libslirp bridge
# shim (src/net/slirp_shim.c). Both are unconditional — see the note below.
cc = "1"

# NO `[features]`. GPU (gfxstream/Metal) and networking (libslirp NAT) are NOT optional and must
# never be: they were cargo features until 2026-07-27, and the failure mode that killed is that
# omitting one produces a binary that *boots perfectly* and is quietly crippled. A `--features
# gfxstream`-only release binary sat on disk being spawned by the Studio: the guest enumerated
# `eth0`, took its 10.0.2.15 lease and started adbd, and nothing ever crossed the wire — so it
# presented as "adb is broken", not "wrong binary". There is no build of this VMM without either.
#
# Build prerequisites (both hard, both checked with a real error in build.rs):
#   * `brew install libslirp`
#   * libgfxstream_backend.dylib in third_party/gfxstream/build-host — run `third_party/bootstrap.sh`
#     (it also builds the KosmicKrisp Vulkan driver a --gpu3d run needs at launch)
