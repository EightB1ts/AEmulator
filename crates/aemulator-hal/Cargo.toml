[package]
name = "aemulator-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host-side guest-HAL protocol state machines (sensors, NCI, HCI, NMEA, AT, vsock) — pure bytes-in/bytes-out, no VMM or platform dependency."

